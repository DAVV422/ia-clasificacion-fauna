# EJEMPLO (HU-IA-06, para Job): el back y la IA en la misma red de Docker. No modifica el repo del back.
#
#   docker compose -f deploy/docker-compose.example.yml run --rm ia python tools/fetch_models.py   # una vez
#   docker compose -f deploy/docker-compose.example.yml up -d
#
# - La IA NO publica puertos (IA-31): solo la ve el back, como http://ia:8001.
# - Para desarrollar sin modelos, se usa ia-fake en lugar de ia (mismo contrato):
#     docker compose -f deploy/docker-compose.example.yml --profile fake up -d back ia-fake
#   y en el back AI_SERVICE_URL=http://ia-fake:8001.
# - El cliente nuevo del back (ai_client.detect_media) arma "{AI_SERVICE_URL}/api/v1/detect": por eso
#   AI_SERVICE_URL va SIN /api/v1. El contrato (IA §1) lo llama AI_BASE_URL e incluye /api/v1: se ponen las dos.
services:
  back:
    build: ../../BACKWWF # el repo del back, al lado de ia-deteccion
    env_file: ../../BACKWWF/.env
    environment:
      AI_SERVICE_URL: http://ia:8001
      AI_BASE_URL: http://ia:8001/api/v1
      AI_API_KEY: ${AI_API_KEY:?definí AI_API_KEY}
      AI_TIMEOUT_SECONDS: "180" # mayor que PROCESS_TIMEOUT_SECONDS de la IA (150)
    ports:
      - "8000:8000"
    depends_on:
      ia:
        condition: service_healthy

  ia:
    build: ..
    image: wwm-ia:latest
    environment:
      AI_API_KEY: ${AI_API_KEY:?definí AI_API_KEY}
      ENVIRONMENT: production
      APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - models:/models
    mem_limit: 6g
    restart: unless-stopped
    # sin "ports:": la IA es interna

  ia-fake:
    profiles: ["fake"]
    build:
      context: ..
      dockerfile: fake/Dockerfile
    environment:
      AI_API_KEY: ${AI_API_KEY:?definí AI_API_KEY}

volumes:
  models:
