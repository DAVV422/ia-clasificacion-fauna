# IA de la web, sola (HU-IA-06). Para levantarla junto al back: deploy/docker-compose.example.yml.
#
#   1. Preparar los modelos (una vez; ~505 MB, verificados por sha256):
#        docker compose run --rm ia python tools/fetch_models.py
#   2. Levantar:
#        docker compose up -d
#        curl http://localhost:8001/api/v1/health
#
# AI_API_KEY: la misma que usa el back (SEC-05). Sin ella y con ENVIRONMENT=production, la IA no arranca.
services:
  ia:
    build: .
    image: wwm-ia:latest
    environment:
      AI_API_KEY: ${AI_API_KEY:-dev-key}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION:-dev}
      INFERENCE_QUEUE_SIZE: ${INFERENCE_QUEUE_SIZE:-2}
      PROCESS_TIMEOUT_SECONDS: ${PROCESS_TIMEOUT_SECONDS:-150}
      MAX_FILE_MB: ${MAX_FILE_MB:-300}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-15}
    volumes:
      - models:/models
    # Desarrollo: publicado en el 8001. En producción NO se publica (IA-31): ver deploy/docker-compose.example.yml.
    ports:
      - "8001:8001"
    mem_limit: 6g # MegaDetector + SpeciesNet en CPU usan ~1,5 GB; el margen es para los picos de video
    restart: unless-stopped

volumes:
  models:
