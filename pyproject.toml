[tool.ruff]
line-length = 120
target-version = "py39"
# El código heredado (API v1, ventana del prototipo, copia congelada) se revisa cuando se reescriba.
extend-exclude = ["app", "desktop/ui/legacy_window.py", "eval/legacy/detector_legacy.py", "build", "dist", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "B008", "SIM108", "SIM102", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["wwm_pipeline", "desktop"]
exclude = ["desktop/ui/"]

[[tool.mypy.overrides]]
module = ["desktop.ui.*"]
ignore_errors = true
