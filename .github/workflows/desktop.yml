# HU-DS-00 · CI de la app de escritorio y del pipeline.
# - checks: lint (ruff), tipos (mypy) y tests unitarios (sin modelos; los de integración se saltan).
# - build: ejecutable onedir + --selftest; solo en tags v* o a mano (tarda ~15 min).
name: desktop

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Instalar dependencias (lock con hashes)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-desktop.txt
          python -m pip install pytest httpx fastapi uvicorn python-multipart ruff mypy
      - name: Lint
        run: |
          python -m ruff check wwm_pipeline desktop fake eval tools tests
          python -m ruff format --check wwm_pipeline desktop fake eval tools tests
      - name: Tipos
        run: python -m mypy
      - name: Tests unitarios
        env:
          WWM_DATA_DIR: ${{ runner.temp }}\wwm-data
        run: python -m pytest -q -m "not integration"

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-desktop.txt
          python -m pip install pyinstaller==6.16.0
      - name: Build onedir
        run: python -m PyInstaller desktop/desktop.spec --noconfirm
      - name: Selftest del ejecutable
        shell: pwsh
        env:
          WWM_DATA_DIR: ${{ runner.temp }}\wwm-data
        run: |
          $p = Start-Process dist\WWMClasificador\WWMClasificador.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:WWM_DATA_DIR\logs\*.log" | Select-String "selftest"
          if ($p.ExitCode -ne 0) { throw "selftest falló ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: WWMClasificador-${{ github.ref_name }}
          path: dist/WWMClasificador
          retention-days: 14
