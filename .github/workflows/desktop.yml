# HU-DS-00 · CI de la app de escritorio y del pipeline.
# - checks: lint (ruff), tipos (mypy) y tests unitarios (sin modelos; los de integración se saltan).
# - installers: build onedir + los dos instaladores (HU-DS-12), instalados en silencio y probados (selftest,
#   smoke sin red de la completa, desinstalación); solo en tags v* o a mano (~45 min).
name: desktop

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Instalar dependencias (lock con hashes)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-desktop.txt
          python -m pip install pytest httpx fastapi uvicorn python-multipart ruff mypy
      - name: Lint
        run: |
          python -m ruff check wwm_pipeline desktop fake eval tools tests
          python -m ruff format --check wwm_pipeline desktop fake eval tools tests
      - name: Tipos
        run: python -m mypy
      - name: Tests unitarios
        env:
          WWM_DATA_DIR: ${{ runner.temp }}\wwm-data
        run: python -m pytest -q -m "not integration"

  installers:
    # HU-DS-12: los dos instaladores del mismo build, instalados en silencio en el runner y probados.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WWM_DATA_DIR: ${{ runner.temp }}\wwm-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-desktop.txt
          python -m pip install pyinstaller==6.16.0
      - name: Inno Setup 6
        run: choco install innosetup --version=6.7.3 -y --no-progress
      - name: Modelos del release models-v1 (con caché)
        id: models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\models-v1
          key: models-v1-${{ hashFiles('desktop/models/model_manifest.json') }}
      - name: Descargar y verificar los modelos
        if: steps.models.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from desktop import model_store as ms; r = ms.install(Path(r'${{ runner.temp }}\models-v1'), ms.load_manifest()); print(r)"
      - name: Versión
        id: version
        shell: pwsh
        run: |
          $v = (python -c "import desktop; print(desktop.__version__)").Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build + instaladores (build.ps1)
        shell: pwsh
        run: .\build.ps1 -Variant both -Version ${{ steps.version.outputs.version }} -ModelsFrom "${{ runner.temp }}\models-v1"
      - name: Instalar en silencio y probar (completo, sin red; estándar)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          python -c "from pathlib import Path; from tests.desktop.fixtures import write_f_set_sint; write_f_set_sint(Path(r'${{ runner.temp }}\sd'))"
          foreach ($variant in @("Completo", "Setup")) {
            $dir = "${{ runner.temp }}\app-$variant"
            $setup = "dist\installers\WWM-Clasificador-$variant-$v.exe"
            $p = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$dir`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "la instalación de $variant falló ($($p.ExitCode))" }
            $exe = Join-Path $dir "WWMClasificador.exe"
            $out = & $exe --selftest | Out-String
            if ($LASTEXITCODE -ne 0 -or $out -match "FALTA") { throw "selftest de $variant falló: $out" }
            if ($variant -eq "Completo") {
              # HU-DS-11 CA-5: la completa clasifica con la salida a internet bloqueada para el ejecutable.
              New-NetFirewallRule -DisplayName "wwm-sin-red" -Direction Outbound -Program $exe -Action Block | Out-Null
              $smoke = & $exe --smoke "${{ runner.temp }}\sd" | Out-String
              Remove-NetFirewallRule -DisplayName "wwm-sin-red"
              $code = $LASTEXITCODE
              Write-Host $smoke
              if ($code -ne 0) { throw "smoke sin red falló" }
              $report = ($smoke.Trim() -split "`n")[-1] | ConvertFrom-Json  # YOLOv5 puede imprimir antes
              if ($report.models_dir -ne (Join-Path $dir "models")) { throw "la completa no usó sus modelos: $($report.models_dir)" }
              if ($report.pending.Count -ne 0) { throw "la completa quería descargar: $($report.pending)" }
            }
            $uninst = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
            $p = Start-Process $uninst.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
            Start-Sleep -Seconds 3
            if (Test-Path (Join-Path $dir "WWMClasificador.exe")) { throw "la desinstalación de $variant dejó la app" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ github.ref_name }}
          path: dist/installers
          retention-days: 30
